; esp32-ptp-grip — PlatformIO project
;
; Build/upload:  pio run -t upload && pio device monitor
; Host tests:    make -C test/host test

[platformio]
default_envs = esp32s3

[env:esp32s3]
; The grip uses a camera on the S3's native USB port (GPIO 19/20) when one is
; plugged in, and the camera's WiFi otherwise. The native port is then the
; camera's, so Serial is on the UART port ("COM" on most boards): upload and
; monitor through that port. The camera port must supply 5 V (README: Camera
; over USB).
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GRIP_CAMERA_USB
lib_deps =
    ; Local checkout of the library while Nikon support is in development.
    ; Replace with the git URL once it is published.
    PtpIpCamera=symlink://../PtpIpCamera
    madhephaestus/ESP32Encoder
    olikraus/U8g2

; WiFi only, for boards without a separate UART/COM port: Serial stays on the
; native USB port, and no camera can be used over USB.
[env:esp32s3-wifi]
extends = env:esp32s3
build_flags =
    -Wall -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=1

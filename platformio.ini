; esp32-ptp-grip — PlatformIO project
;
; Build/upload:  pio run -t upload && pio device monitor
; Host tests:    make -C test/host test

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall -Wextra
    ; Serial over the S3's native USB port. Boards with a separate UART port
    ; (e.g. DevKitC "UART") can remove this to use that port instead.
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; Local checkout of the library while Nikon support is in development.
    ; Replace with the git URL once it is published.
    PtpIpCamera=symlink://../PtpIpCamera
    madhephaestus/ESP32Encoder
    olikraus/U8g2

; Camera over USB instead of WiFi: the S3's native USB port (GPIO 19/20)
; becomes a USB host for the camera, so Serial moves to the UART port
; ("COM" on most boards); upload and monitor through that port.
;   pio run -e esp32s3-usb -t upload && pio device monitor -e esp32s3-usb
; The camera port must supply 5 V (see README: Camera over USB).
[env:esp32s3-usb]
extends = env:esp32s3
build_flags =
    -Wall -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GRIP_CAMERA_USB
